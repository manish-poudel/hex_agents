[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hex_agents"
version = "0.1.0"
description = "Hexlipi agentic ai app"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    {name="Manish Poudel"}
]

dependencies = [
    "fastapi",
    "langchain",
    "pypdf",
    "langchain_ollama",
    "langchain_google_genai",
    "langchain_community"
]

[tool.setuptools.packages.find]
where = ["src"]